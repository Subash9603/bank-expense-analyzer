<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In - AI Bank Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 px-3">
            <div class="auth-card glass-panel w-100 p-4" style="max-width: 420px;">
                <div class="text-center mb-4">
                    <div class="auth-logo mb-2">
                        <i class="fa-solid fa-wallet gradient-text fs-1"></i>
                    </div>
                    <h2 class="fw-bold tracking-tight mb-1">AI Bank Analyzer</h2>
                    <p class="text-secondary small">Gain control of your daily financial life</p>
                </div>

                <!-- Alert container for error/success messages -->
                <div id="alertContainer"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary small fw-medium">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 bg-dark-subtle text-secondary"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control border-0 bg-dark-subtle text-white" id="email" required placeholder="name@example.com">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label text-secondary small fw-medium mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text border-0 bg-dark-subtle text-secondary"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control border-0 bg-dark-subtle text-white" id="password" required placeholder="Enter password">
                        </div>
                    </div>

                    <div class="mb-4 form-check d-flex align-items-center">
                        <input type="checkbox" class="form-check-input bg-dark border-0" id="remember">
                        <label class="form-check-label text-secondary small ms-2" for="remember">Remember my session</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-bold border-0 shadow-lg gradient-btn mb-3">
                        Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-secondary small mb-0">
                        New to AI Bank Analyzer? 
                        <a href="register.html" class="gradient-text fw-semibold text-decoration-none">Create Account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already authenticated
            checkAnonymousSession();

            // Handle Login Form
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const remember = document.getElementById('remember').checked;
                
                const alerts = document.getElementById('alertContainer');
                alerts.innerHTML = '';

                try {
                    const response = await apiFetch('/api/auth/login', {
                        method: 'POST',
                        body: { email, password, remember }
                    });
                    
                    if (!response) return;
                    const data = await response.json();
                    
                    if (data.status === 'ok') {
                        window.location.href = 'index.html';
                    } else {
                        alerts.innerHTML = `
                            <div class="alert alert-danger border-0 text-white bg-opacity-10 bg-danger mb-3" role="alert">
                                <small>${data.message}</small>
                            </div>
                        `;
                    }
                } catch (err) {
                    alerts.innerHTML = `
                        <div class="alert alert-danger border-0 text-white bg-opacity-10 bg-danger mb-3" role="alert">
                            <small>${err.message}</small>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>
</html>
