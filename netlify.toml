[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-DOMAIN/api/:splat"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200
