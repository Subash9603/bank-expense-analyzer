<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Account - AI Bank Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 px-3">
            <div class="auth-card glass-panel w-100 p-4" style="max-width: 420px;">
                <div class="text-center mb-4">
                    <div class="auth-logo mb-2">
                        <i class="fa-solid fa-wallet gradient-text fs-1"></i>
                    </div>
                    <h2 class="fw-bold tracking-tight mb-1">Create Account</h2>
                    <p class="text-secondary small">Start optimizing your financial wellness today</p>
                </div>

                <!-- Alert container for error/success messages -->
                <div id="alertContainer"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="name" class="form-label text-secondary small fw-medium">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 bg-dark-subtle text-secondary"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control border-0 bg-dark-subtle text-white" id="name" required placeholder="John Doe">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary small fw-medium">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 bg-dark-subtle text-secondary"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control border-0 bg-dark-subtle text-white" id="email" required placeholder="name@example.com">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small fw-medium">Password</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 bg-dark-subtle text-secondary"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control border-0 bg-dark-subtle text-white" id="password" required placeholder="Create strong password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-bold border-0 shadow-lg gradient-btn mb-3">
                        Register <i class="fa-solid fa-user-plus ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-secondary small mb-0">
                        Already registered? 
                        <a href="login.html" class="gradient-text fw-semibold text-decoration-none">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already authenticated
            checkAnonymousSession();

            // Handle Register Form
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                
                const alerts = document.getElementById('alertContainer');
                alerts.innerHTML = '';

                try {
                    const response = await apiFetch('/api/auth/register', {
                        method: 'POST',
                        body: { name, email, password }
                    });
                    
                    if (!response) return;
                    const data = await response.json();
                    
                    if (data.status === 'ok') {
                        alerts.innerHTML = `
                            <div class="alert alert-success border-0 text-white bg-opacity-10 bg-success mb-3" role="alert">
                                <small>Registration successful! Redirecting...</small>
                            </div>
                        `;
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1200);
                    } else {
                        alerts.innerHTML = `
                            <div class="alert alert-danger border-0 text-white bg-opacity-10 bg-danger mb-3" role="alert">
                                <small>${data.message}</small>
                            </div>
                        `;
                    }
                } catch (err) {
                    alerts.innerHTML = `
                        <div class="alert alert-danger border-0 text-white bg-opacity-10 bg-danger mb-3" role="alert">
                            <small>${err.message}</small>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>
</html>
